<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socios</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}"></head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main>
    <h2>Listado de socios</h2><div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
    <div class="panel">
        <form method="get" th:action="@{/socios}" class="form-grid">
            <div><label for="nombre">Nombre o apellidos</label><input id="nombre" name="nombre" th:value="${nombre}"></div>
            <div><label for="email">Email</label><input id="email" name="email" th:value="${email}"></div>
            <div><label for="activo">Activo</label><select id="activo" name="activo">
                <option value="">Todos</option><option value="true" th:selected="${activo == true}">Sí</option><option value="false" th:selected="${activo == false}">No</option>
            </select></div>
            <div><button type="submit">Buscar</button> <a class="boton boton-secundario" th:href="@{/socios}">Limpiar</a></div>
        </form>
    </div>
    <div class="acciones"><a class="boton" th:href="@{/socios/insertar}">Insertar socio</a></div>
    <div class="panel">
        <p class="vacio" th:if="${#lists.isEmpty(listaSocios)}">No se han encontrado socios.</p>
        <table class="tabla" th:if="${!#lists.isEmpty(listaSocios)}">
            <thead><tr><th>ID</th><th>Nombre</th><th>Apellidos</th><th>Email</th><th>Edad</th><th>Activo</th><th>Préstamos abiertos</th></tr></thead>
            <tbody><tr th:each="fila : ${listaSocios}">
                <td th:text="${fila.socio.id}"></td><td th:text="${fila.socio.nombre}"></td><td th:text="${fila.socio.apellidos}"></td>
                <td th:text="${fila.socio.email}"></td><td th:text="${fila.edad}"></td>
                <td th:text="${fila.socio.activa ? 'Sí' : 'No'}"></td><td th:text="${fila.prestamosAbiertos}"></td>
            </tr></tbody>
        </table>
    </div>
</main></body></html>
