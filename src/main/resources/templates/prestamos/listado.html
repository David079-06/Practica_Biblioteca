<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}"></head>
<body><div th:replace="~{fragmentos/menu :: menu}"></div>
<main><h2>Listado de préstamos</h2><div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
    <div class="panel"><form method="get" th:action="@{/prestamos}" class="form-grid">
        <div><label for="nombre">Socio</label><input id="nombre" name="nombre" th:value="${nombre}"></div>
        <div><label for="titulo">Videojuego</label><input id="titulo" name="titulo" th:value="${titulo}"></div>
        <div><label for="estado">Estado</label><select id="estado" name="estado">
            <option value="TODOS" th:selected="${estado == null or estado == 'TODOS'}">Todos</option>
            <option value="EN PLAZO" th:selected="${estado == 'EN PLAZO'}">En plazo</option>
            <option value="VENCIDO" th:selected="${estado == 'VENCIDO'}">Vencidos</option>
            <option value="DEVUELTO" th:selected="${estado == 'DEVUELTO'}">Devueltos</option>
        </select></div>
        <div><label for="fechaDesde">Fecha de préstamo desde</label><input id="fechaDesde" name="fechaDesde" type="date" th:value="${fechaDesde}"></div>
        <div><button type="submit">Buscar</button> <a class="boton boton-secundario" th:href="@{/prestamos}">Limpiar</a></div>
    </form></div>
    <div class="acciones"><a class="boton" th:href="@{/prestamos/registrar}">Registrar préstamo</a><a class="boton" th:href="@{/prestamos/devolver}">Devolver préstamo</a></div>
    <div class="panel">
        <p class="vacio" th:if="${#lists.isEmpty(listaPrestamos)}">No se han encontrado préstamos.</p>
        <table class="tabla" th:if="${!#lists.isEmpty(listaPrestamos)}">
            <thead><tr><th>ID</th><th>Socio</th><th>Videojuego</th><th>Plataforma</th><th>Copia</th><th>Préstamo</th><th>Límite</th><th>Devolución</th><th>Multa</th><th>Estado</th><th>Días retraso</th></tr></thead>
            <tbody><tr th:each="fila : ${listaPrestamos}">
                <td th:text="${fila.prestamo.id}"></td><td th:text="${fila.socio}"></td><td th:text="${fila.videojuego}"></td>
                <td th:text="${fila.plataforma}"></td><td th:text="${fila.codigoInventario}"></td>
                <td th:text="${fila.prestamo.fechaPrestamo}"></td><td th:text="${fila.prestamo.fechaLimite}"></td>
                <td th:text="${fila.prestamo.fechaDevolucion == null ? '-' : fila.prestamo.fechaDevolucion}"></td>
                <td th:text="${#numbers.formatDecimal(fila.prestamo.multa, 1, 2)} + ' €'"></td>
                <td><span class="estado" th:classappend="${fila.estado == 'VENCIDO' ? ' estado-VENCIDO' : (fila.estado == 'DEVUELTO' ? ' estado-DEVUELTO' : ' estado-EN_PLAZO')}" th:text="${fila.estado}"></span></td>
                <td th:text="${fila.diasRetraso > 0 ? fila.diasRetraso : '-'}"></td>
            </tr></tbody>
        </table>
    </div>
</main></body></html>
