<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar videojuego</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}"></head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main>
    <h2>Insertar videojuego</h2><div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
    <div class="panel">
        <form method="post" th:action="@{/videojuegos/insertar}" class="form-grid">
            <div><label for="titulo">Título</label><input id="titulo" name="titulo" required th:value="${titulo}"></div>
            <div><label for="anioLanzamiento">Año de lanzamiento</label><input id="anioLanzamiento" name="anioLanzamiento" type="number" min="1970" required th:value="${anioLanzamiento}"></div>
            <div><label for="pegi">PEGI</label><select id="pegi" name="pegi" required>
                <option value="">Selecciona</option>
                <option value="3" th:selected="${pegi == '3'}">3</option><option value="7" th:selected="${pegi == '7'}">7</option>
                <option value="12" th:selected="${pegi == '12'}">12</option><option value="16" th:selected="${pegi == '16'}">16</option><option value="18" th:selected="${pegi == '18'}">18</option>
            </select></div>
            <div><label for="idDesarrolladora">Desarrolladora</label><select id="idDesarrolladora" name="idDesarrolladora" required>
                <option value="">Selecciona</option><option th:each="dev : ${listaDesarrolladoras}" th:value="${dev.id}"
                        th:text="${dev.nombre}" th:selected="${idDesarrolladora != null and #strings.toString(dev.id) == idDesarrolladora}"></option>
            </select></div>
            <div><button type="submit">Guardar</button> <a class="boton boton-secundario" th:href="@{/videojuegos}">Volver</a></div>
        </form>
    </div>
</main></body></html>
